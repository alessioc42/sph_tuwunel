name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      - name: Install
        run: bun install --frozen-lockfile

      - name: Start tuwunel
        run: |
          docker run -d --name tuwunel \
            -p 8008:8008 \
            -e TUWUNEL_CONFIG=/etc/tuwunel.toml \
            -v "$PWD/deploy/ci/tuwunel.toml:/etc/tuwunel.toml:ro" \
            ghcr.io/matrix-construct/tuwunel:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8008/_matrix/client/versions >/dev/null; then
              echo "tuwunel ready"
              exit 0
            fi
            sleep 1
          done
          echo "tuwunel failed to become ready" >&2
          docker ps -a || true
          docker logs tuwunel || true
          exit 1

      - name: Test
        env:
          MATRIX_HOMESERVER: http://127.0.0.1:8008
          JWT_SECRET: matrix-plug-e2e-local-hmac-secret-do-not-use-in-prod
          SPH_SECRET: test-secret-aaaaaaaaaaaaaaaa
        run: bun test

      - name: Docker build (test + runtime stages)
        run: |
          docker build --target test -t sph-jwt-bridge:test .
          docker build --target runtime -t sph-jwt-bridge:ci .

      - name: Smoke against host tuwunel
        run: |
          cid=$(docker run -d --network host \
            -e PORT=13000 \
            -e SPH_SECRET=test-secret-aaaaaaaaaaaaaaaa \
            -e JWT_SECRET=matrix-plug-e2e-local-hmac-secret-do-not-use-in-prod \
            -e PUBLIC_BASE_URL=http://127.0.0.1:13000 \
            -e MATRIX_HOMESERVER=http://127.0.0.1:8008 \
            -e MATRIX_SERVER_NAME=localhost \
            -e ELEMENT_WEB_URL=http://127.0.0.1:8080 \
            -e ENABLE_MATRIX_PROXY=true \
            -e ALLOW_ALL_IPS=true \
            -e FOLDER_NAME=matrix \
            sph-jwt-bridge:ci)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:13000/health >/dev/null && break
            sleep 0.25
          done
          bun run ./scripts/smoke-sph.ts http://127.0.0.1:13000

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
