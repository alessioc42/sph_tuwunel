# Publishes two host ports for your reverse proxy (NPM / nginx / Caddy / …).
# No custom Docker networks — default compose network only.
#
#   BRIDGE_PORT  → SPH tile + Matrix CS API (proxied to tuwunel inside the stack)
#   ELEMENT_PORT → Cinny static UI (env name kept so existing Portainer stacks
#                  and NPM forwards do not need to change)
#
# Point PUBLIC_BASE_URL / ELEMENT_WEB_URL at the public https hostnames you terminate
# on the proxy. Forward those hostnames to 127.0.0.1:$BRIDGE_PORT and :$ELEMENT_PORT.

name: sph-tuwunel

services:
  config-init:
    image: alpine:3.21
    restart: "no"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      ELEMENT_WEB_URL: ${ELEMENT_WEB_URL:?}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?}
      JWT_SECRET: ${JWT_SECRET:?}
    volumes:
      - element-config:/out/element
      - tuwunel-config:/out/tuwunel
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        PUB=$${PUBLIC_BASE_URL%/}
        HS=$${PUB#https://}
        HS=$${HS#http://}
        HS=$${HS%%/*}
        cat > /out/element/config.json <<EOF
        {
          "defaultHomeserver": 0,
          "homeserverList": ["$${HS}"],
          "allowCustomHomeservers": false,
          "hashRouter": {
            "enabled": true,
            "basename": "/"
          },
          "featuredCommunities": {
            "openAsDefault": false,
            "spaces": [],
            "rooms": [],
            "servers": ["$${MATRIX_SERVER_NAME}"]
          }
        }
        EOF
        cat > /out/tuwunel/tuwunel.toml <<EOF
        [global]
        server_name = "$${MATRIX_SERVER_NAME}"
        database_path = "/var/lib/tuwunel"
        address = ["0.0.0.0"]
        port = 8008
        allow_federation = false
        allow_registration = false
        trusted_servers = []
        new_user_displayname_suffix = ""

        [global.jwt]
        enable = true
        key = "$${JWT_SECRET}"
        format = "HMAC"
        algorithm = "HS256"
        register_user = true
        EOF
        echo "config-init ok hs=$${HS}"

  bridge:
    image: ${BRIDGE_IMAGE:-ghcr.io/alessioc42/sph_tuwunel:latest}
    container_name: ${BRIDGE_CONTAINER_NAME:-sph-bridge}
    restart: unless-stopped
    ports:
      - "${BRIDGE_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      ELEMENT_WEB_URL: ${ELEMENT_WEB_URL:?}
      SPH_SECRET: ${SPH_SECRET:?}
      JWT_SECRET: ${JWT_SECRET:?}
      MATRIX_HOMESERVER: http://tuwunel:8008
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?}
      ENABLE_MATRIX_PROXY: "true"
      ALLOW_ALL_IPS: ${ALLOW_ALL_IPS:-false}
      FOLDER_NAME: ${FOLDER_NAME:-matrix}
      CORS_ORIGINS: ${ELEMENT_WEB_URL:?}
      CONNECT_TTL_SECONDS: ${CONNECT_TTL_SECONDS:-120}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      DATA_DIR: /app/data
    volumes:
      - bridge-data:/app/data
    depends_on:
      - tuwunel

  tuwunel:
    image: ${TUWUNEL_IMAGE:-ghcr.io/matrix-construct/tuwunel:latest}
    container_name: ${TUWUNEL_CONTAINER_NAME:-sph-tuwunel-hs}
    restart: unless-stopped
    # Not published — only reachable as http://tuwunel:8008 on the compose network.
    environment:
      TUWUNEL_CONFIG: /config/tuwunel.toml
    volumes:
      - tuwunel-config:/config:ro
      - tuwunel-data:/var/lib/tuwunel
    depends_on:
      config-init:
        condition: service_completed_successfully

  cinny:
    image: ${CINNY_IMAGE:-ajbura/cinny:v4.12.6}
    container_name: ${CINNY_CONTAINER_NAME:-sph-cinny}
    restart: unless-stopped
    ports:
      - "${ELEMENT_PORT:-8080}:80"
    volumes:
      - type: volume
        source: element-config
        target: /usr/share/nginx/html/config.json
        read_only: true
        volume:
          subpath: config.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 --spider http://127.0.0.1:80/config.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      config-init:
        condition: service_completed_successfully
      bridge:
        condition: service_started

volumes:
  bridge-data:
  tuwunel-data:
  element-config:
  tuwunel-config:
